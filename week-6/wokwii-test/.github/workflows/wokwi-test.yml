name: Wokwi ESP32-C6 Simulation Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Cache PlatformIO
      uses: actions/cache@v4
      with:
        path: |
          ~/.platformio
          .pio
        key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}
        restore-keys: |
          ${{ runner.os }}-pio-
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install platformio
    
    - name: Install dependencies
      run: pio pkg install
    
    - name: Build firmware
      run: pio run --environment seeed_xiao_esp32c6
    
    - name: Install Wokwi CLI
      run: |
        curl -L https://wokwi.com/ci/install.sh | sh
    
    - name: Run Wokwi Simulation
      env:
        WOKWI_CLI_TOKEN: ${{ secrets.WOKWI_CLI_TOKEN }}
      run: |
        wokwi-cli \
          --timeout 30000 \
          --timeout-exit-code 0 \
          --serial-log-file serial-output.txt \
          .
    
    - name: Check simulation results
      run: |
        echo "=== Serial Output ==="
        cat serial-output.txt || echo "No serial output captured"
        
        # Add custom checks here based on your expected output
        # Example: Check if initialization message appears
        if grep -q "Test Started" serial-output.txt; then
          echo "✓ Initialization successful"
        else
          echo "✗ Initialization message not found"
          exit 1
        fi
    
    - name: Upload simulation artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: simulation-results
        path: |
          serial-output.txt
          .pio/build/seeed_xiao_esp32c6/firmware.elf
          .pio/build/seeed_xiao_esp32c6/firmware.hex
        retention-days: 7
    
    - name: Comment PR with results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          let output = 'No output';
          if (fs.existsSync('serial-output.txt')) {
            output = fs.readFileSync('serial-output.txt', 'utf8');
          }
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `## Wokwi Simulation Results\n\n✅ Simulation completed successfully!\n\n<details><summary>Serial Output</summary>\n\n\`\`\`\n${output.slice(0, 4000)}\n\`\`\`\n\n</details>`
          });
