; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:seeed_xiao_esp32c6]
platform = https://github.com/pioarduino/platform-espressif32.git
board = seeed_xiao_esp32c6
framework = arduino

; Serial Monitor options
monitor_speed = 115200
monitor_filters = 
	default
	time

; Upload options
upload_speed = 921600

; Build options
build_flags = 
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D ARDUINO_USB_MODE=1

; Library dependencies for your components
lib_deps = 
	adafruit/Adafruit SSD1306@^2.5.7
	adafruit/Adafruit GFX Library@^1.11.3
	adafruit/Adafruit NeoPixel@^1.15.1
	bblanchon/ArduinoJson@^7.4.2

; Wokwi simulation support
; The firmware files will be generated in .pio/build/seeed_xiao_esp32c6/
extra_scripts = 
	; Optional: Add post-build scripts here

; Different build environments for testing
[env:seeed_xiao_esp32c6_debug]
extends = env:seeed_xiao_esp32c6
build_type = debug
build_flags = 
	${env:seeed_xiao_esp32c6.build_flags}
	-D DEBUG=1
	-D CORE_DEBUG_LEVEL=5
monitor_filters = 
	default
	time
	esp32_exception_decoder

[env:seeed_xiao_esp32c6_release]
extends = env:seeed_xiao_esp32c6
build_flags = 
	${env:seeed_xiao_esp32c6.build_flags}
	-D NDEBUG
	-O2
